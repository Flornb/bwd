# Deploy automático a Hostinger por SSH (rsync).
# Cada push a main que cambie public_html/ o app/ sube SOLO los archivos modificados.
# Nunca toca app/config.php ni app/storage/ (tus claves y registros quedan en el servidor).
# No borra nada en el servidor: solo agrega y actualiza.
#
# Configuración (GitHub > repo > Settings > Secrets and variables > Actions):
#   Secret:  SSH_PRIVATE_KEY  -> la clave privada generada solo para este deploy
#   La huella del servidor (SSH_FINGERPRINT, abajo) asegura que nos conectamos al Hostinger real.

name: Deploy a Hostinger

on:
  push:
    branches: [main]
    paths: ['public_html/**', 'app/**']
  workflow_dispatch: {}

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

env:
  SSH_HOST: 147.93.39.25
  SSH_PORT: '65002'
  SSH_USER: u855032084
  SSH_FINGERPRINT: 'SHA256:p3FlXjYCwJ6+ryEyDfB9mlVQFQKCzNOjK0fC/KlCh/E'   # ED25519, de hPanel > Acceso SSH
  SITE_DIR: domains/bohnwebdesign.com.ar

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Preparar clave y verificar identidad del servidor
        env:
          KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          [ -n "$KEY" ] || { echo "::error::Falta el secret SSH_PRIVATE_KEY"; exit 1; }
          [ -n "$SSH_FINGERPRINT" ] || { echo "::error::Falta la variable SSH_FINGERPRINT"; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" -t ed25519 "$SSH_HOST" 2>/dev/null > /tmp/hostkey
          GOT=$(ssh-keygen -lf /tmp/hostkey | awk '{print $2}')
          WANT="${SSH_FINGERPRINT#SHA256:}"
          if [ "${GOT#SHA256:}" != "$WANT" ]; then
            echo "::error::La huella del servidor no coincide ($GOT). No se sube nada."; exit 1
          fi
          cat /tmp/hostkey >> ~/.ssh/known_hosts
          echo "Servidor verificado: $GOT"

      - name: Verificar destino
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" \
            "test -d $SITE_DIR/public_html && test -d $SITE_DIR/app" \
            || { echo "::error::No encontré $SITE_DIR/public_html y $SITE_DIR/app en el servidor."; exit 1; }

      - name: Subir public_html
        run: |
          rsync -rlz --checksum --itemize-changes --exclude='.git*' \
            -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT -o BatchMode=yes" \
            public_html/ "$SSH_USER@$SSH_HOST:$SITE_DIR/public_html/"

      - name: Subir app (sin config ni registros)
        run: |
          rsync -rlz --checksum --itemize-changes --exclude='.git*' --exclude='/config.php' --exclude='/storage/' \
            -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT -o BatchMode=yes" \
            app/ "$SSH_USER@$SSH_HOST:$SITE_DIR/app/"

      - name: Borrar la clave del runner
        if: always()
        run: rm -f ~/.ssh/deploy_key
